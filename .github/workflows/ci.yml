name: CI

# 触发分支必须对齐本仓库真实分支：origin 为 main（默认）+ dev。
# 历史配置写的是 master —— 那只是 upstream 父仓库的分支，导致本仓库 CI 从未被触发过。
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 挂真实 Postgres：每次 CI 都会在全新空库上真跑一遍完整 Flyway 迁移链
    # （此前 CI 里所有迁移都是零验证），并让依赖真实 DB 的集成用例真正执行而非跳过。
    # 刻意不挂 Redis：实测 Redis 不可用时 Spring 上下文仍能启动（消费者只报连接告警），
    # 相关用例不依赖它；多加一个 service 只会拖慢 CI。
    # 迁移自带 CREATE EXTENSION（hstore / uuid-ossp / vector），故无需挂载 init.sql。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_guide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # 依赖本地二进制（Typst golden）与语音面试 test profile 的用例仍按条件跳过，
      # 跳过是显式声明的预期行为；任何 failures/errors 都必须为 0。
      - name: Run backend tests
        env:
          # 集成用例按「环境变量 → 项目根 .env」解析凭据；CI 无 .env，故由此注入
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: interview_guide
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: ./gradlew :app:test --no-daemon

  agent:
    name: Agent service checks (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent-service/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: |
          pnpm run test:interview-history
          pnpm run test:question-generation
          pnpm run test:interview-capacity
          pnpm run test:interview-entry
          pnpm run test:copilot-action
          pnpm run test:copilot-turn-status
          pnpm run test:code-language
          pnpm run test:interview-turns
          pnpm run test:profile-impact
          pnpm run test:evaluate-polling
          pnpm run test:resume-patch-selection
          pnpm run test:resume-content-edit
          pnpm run test:interview-turn-sync
          pnpm run test:async-flow

      - name: Build frontend
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # E2E 用例自带 WebSocket stub 与 API route mock，只需前端 dev server，不依赖 Java / DB
      - name: Run E2E tests
        run: pnpm run test:e2e

  # 聚合门禁：分支保护只需勾选这一个 check。
  # 「禁止带失败基线继续累计功能」是 P6-0 的核心约束，故显式阻断。
  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - backend
      - agent
      - frontend
    runs-on: ubuntu-latest

    steps:
      - name: Verify all gates are green
        run: |
          echo "backend : ${{ needs.backend.result }}"
          echo "agent   : ${{ needs.agent.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.agent.result }}" != "success" ] \
            || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::质量门禁未全绿（P6-0），禁止带失败基线继续累计功能"
            exit 1
          fi
          echo "质量门禁全部通过"
